name: Android TV launcher APK

on:
  push:
    paths:
      - "launcher/android-tv/**"
      - ".github/workflows/launcher-apk.yml"
  pull_request:
    paths:
      - "launcher/android-tv/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher/android-tv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Point Gradle at the runner's Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Build
        run: ./gradlew assembleRelease --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: castinglayer-launcher
          path: launcher/android-tv/app/build/outputs/apk/release/*.apk
