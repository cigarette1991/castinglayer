[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "castinglayer"
version = "0.1.0"
description = "Mirror your macOS display to any Google Cast device (Chromecast, Google TV, Nest Hub) from the command line."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "pychromecast>=13,<15",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
castlayer = "castinglayer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
